<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>JAVA/CSS Attendance</title>


  <!-- =====================================================
       QR SCANNER LIBRARY
       ===================================================== -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <!-- =====================================================
       STYLE
       ===================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      color: #202124;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .scanner-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    #reader {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }
    #reader video {
      transform: scaleX(-1);
    }

    .status {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }

    .success {
      color: #188038;
    }

    .error {
      color: #d93025;
    }

    .info {
      text-align: center;
      font-size: 20px;
      line-height: 1.7;
      margin-top: 20px;
    }

    .qr-label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .qr-data {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      background: #f1f3f4;
      border-radius: 8px;
      text-align: left;
      font-size: 18px;
      line-height: 1.5;
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    .lrn-label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .lrn-data {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      background: #e8f0fe;
      border-radius: 8px;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: center;
    }

    .student-data {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      background: #e6f4ea;
      border-radius: 8px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .section-data {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      background: #fef7e0;
      border-radius: 8px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .time-data {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: #f1f3f4;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
    }

    .button {
      border: none;
      border-radius: 8px;
      padding: 14px 25px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      background: #1a73e8;
      color: white;
    }

    .button:hover {
      background: #1557b0;
    }

    .center {
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {

      .container {
        padding: 15px;
      }

      .scanner-card {
        padding: 15px;
      }

      h1 {
        font-size: 24px;
      }

      .status {
        font-size: 20px;
      }

      .info {
        font-size: 18px;
      }

      .lrn-data {
        font-size: 22px;
      }

    }

  </style>

</head>


<body>


  <div class="container">

    <h1>
      JAVA/CSS Attendance
    </h1>

    <div class="subtitle">
      Learner QR Scanner
    </div>


    <div class="scanner-card">


      <!-- =================================================
           SCANNER
           ================================================= -->

      <div id="scannerSection">

        <div
          id="status"
          class="status">

          READY TO SCAN

        </div>

        <div id="reader"></div>

      </div>


      <!-- =================================================
           SUCCESS
           ================================================= -->

      <div
        id="successSection"
        class="hidden">

        <div class="status success">

          ✓ LOGGED SUCCESSFULLY

        </div>

        <div
          id="studentInfo"
          class="info">
        </div>

        <div class="center">

          <button
            type="button"
            class="button"
            onclick="startScanner()">

            SCAN NEXT LEARNER

          </button>

        </div>

      </div>


      <!-- =================================================
           ERROR
           ================================================= -->

      <div
        id="errorSection"
        class="hidden">

        <div class="status error">

          ✕ ERROR

        </div>

        <div
          id="errorMessage"
          class="info">
        </div>

        <div class="center">

          <button
            type="button"
            class="button"
            onclick="startScanner()">

            TRY AGAIN

          </button>

        </div>

      </div>


    </div>

  </div>


  <!-- =====================================================
       HIDDEN IFRAME

       The iframe is used to make the GET request to
       Apps Script without leaving the scanner page.
       ===================================================== -->

  <iframe
    id="logFrame"
    name="logFrame"
    style="
      display:none;
      width:0;
      height:0;
      border:0;
    ">
  </iframe>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       APPS SCRIPT URL
       ===================================================== */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzIxOUSFs8XCDlT2O7oU-FC48UUb61G9dJRN45ZiKOMU_4gO27Pp1kXWlP2R4RF5ASIpg/exec";


    /* =====================================================
       SCANNER VARIABLES
       ===================================================== */

    let scanner = null;

    let scanning = false;

    let logging = false;


    /* =====================================================
       START SCANNER
       ===================================================== */

    async function startScanner() {

      console.log("Starting scanner...");

      scanning = false;

      logging = false;


      /*
       * Hide success
       */

      document
        .getElementById("successSection")
        .classList.add("hidden");


      /*
       * Hide error
       */

      document
        .getElementById("errorSection")
        .classList.add("hidden");


      /*
       * Show scanner
       */

      document
        .getElementById("scannerSection")
        .style.display = "block";


      /*
       * Status
       */

      document
        .getElementById("status")
        .innerText =
          "STARTING CAMERA...";


      /* =================================================
         STOP PREVIOUS SCANNER
         ================================================= */

      if (scanner !== null) {

        try {

          if (scanner.isScanning) {

            await scanner.stop();

          }

        } catch (error) {

          console.log(
            "Previous scanner stop:",
            error
          );

        }

        try {

          await scanner.clear();

        } catch (error) {

          console.log(
            "Previous scanner clear:",
            error
          );

        }

        scanner = null;

      }


      /*
       * Clear reader
       */

      document
        .getElementById("reader")
        .innerHTML = "";


      /* =================================================
         CREATE SCANNER
         ================================================= */

      scanner =
        new Html5Qrcode("reader");


      /* =================================================
         CONFIGURATION
         ================================================= */

      const config = {

        fps: 10,

        qrbox: {
          width: 300,
          height: 300
        },

        aspectRatio: 1.0

      };


      /* =================================================
         START CAMERA
         ================================================= */

      try {

        await scanner.start(

          {
            facingMode: "user"
          },

          config,

          handleQRCode,

          function(errorMessage) {

            // Ignore continuous QR search errors.

          }

        );


        scanning = true;


        document
          .getElementById("status")
          .innerText =
            "READY TO SCAN";


        console.log(
          "Scanner started successfully."
        );

      }


      catch (error) {

        console.error(
          "Camera start error:",
          error
        );


        showError(

          "Unable to start the camera.\n\n" +

          "Please check:\n\n" +

          "• Camera permission\n" +

          "• Laptop webcam\n" +

          "• Another application using the webcam\n" +

          "• HTTPS connection"

        );

      }

    }


    /* =====================================================
       QR CODE FOUND
       ===================================================== */

    async function handleQRCode(
      decodedText
    ) {


      /*
       * Prevent duplicate scans.
       */

      if (!scanning || logging) {

        return;

      }


      scanning = false;

      logging = true;


      /* =================================================
         COMPLETE QR DATA
         ================================================= */

      const qrData =
        String(decodedText).trim();


      console.log(
        "FULL QR DATA:",
        qrData
      );


      /* =================================================
         EXTRACT LRN
         ================================================= */

      const lrn =
        qrData
          .split(",")[0]
          .trim();


      console.log(
        "LRN:",
        lrn
      );


      /* =================================================
         VALIDATE LRN
         ================================================= */

      if (!/^\d{12}$/.test(lrn)) {

        logging = false;

        showError(

          "INVALID QR CODE\n\n" +

          "FULL QR DATA:\n" +

          qrData +

          "\n\n" +

          "EXTRACTED LRN:\n" +

          lrn

        );

        return;

      }


      /* =================================================
         STOP CAMERA
         ================================================= */

      try {

        if (
          scanner &&
          scanner.isScanning
        ) {

          await scanner.stop();

        }

      }

      catch (error) {

        console.log(
          "Scanner stop error:",
          error
        );

      }


      /* =================================================
         STATUS
         ================================================= */

      document
        .getElementById("status")
        .innerText =
          "LOGGING " + lrn + "...";


      /* =================================================
         SEND TO APPS SCRIPT
         ================================================= */

      sendScan(
        lrn,
        qrData
      );

    }


    /* =====================================================
       SEND SCAN

       IMPORTANT:

       This now uses GET, which is the same method we
       successfully tested directly in Chrome.

       Example:

       /exec?lrn=405822180041&station=MAIN&logType=SCAN
       ===================================================== */

    function sendScan(
      lrn,
      qrData
    ) {


      console.log(
        "Sending GET request:",
        lrn
      );


      const timestamp =
        Date.now();


      const url =
        APPS_SCRIPT_URL +

        "?lrn=" +
        encodeURIComponent(lrn) +

        "&station=MAIN" +

        "&logType=SCAN" +

        "&t=" +
        timestamp;


      console.log(
        "Apps Script URL:",
        url
      );


      /*
       * Send the GET request through the hidden iframe.
       */

      const frame =
        document.getElementById(
          "logFrame"
        );


      /*
       * Change iframe source.

       This causes Apps Script doGet() to execute.
       */

      frame.src = url;


      /*
       * Give Apps Script time to process the request,
       * then display the scanned information.
       *
       * The request itself is sent to Apps Script;
       * the iframe is intentionally hidden.
       */

      setTimeout(
        function() {

          showSuccess(
            qrData,
            lrn
          );

        },
        1200
      );

    }


    /* =====================================================
       SHOW SUCCESS
       ===================================================== */

    function showSuccess(
      qrData,
      lrn
    ) {


      document
        .getElementById("scannerSection")
        .style.display = "none";


      document
        .getElementById("errorSection")
        .classList.add("hidden");


      document
        .getElementById("successSection")
        .classList.remove("hidden");


      document
        .getElementById("studentInfo")
        .innerHTML =

        /*
         * FULL QR
         */

        "<div>" +

          "<strong class=\"qr-label\">" +

            "FULL QR DATA:" +

          "</strong>" +

          "<div class=\"qr-data\">" +

            escapeHtml(qrData) +

          "</div>" +

        "</div>" +


        /*
         * LRN
         */

        "<div style=\"margin-top:25px;\">" +

          "<strong class=\"lrn-label\">" +

            "LRN:" +

          "</strong>" +

          "<div class=\"lrn-data\">" +

            escapeHtml(lrn) +

          "</div>" +

        "</div>" +


        /*
         * MESSAGE
         */

        "<div style=\"margin-top:20px;\">" +

          "The learner's attendance has been recorded." +

        "</div>";

    }


    /* =====================================================
       SHOW ERROR
       ===================================================== */

    async function showError(
      message
    ) {


      scanning = false;

      logging = false;


      if (scanner) {

        try {

          if (scanner.isScanning) {

            await scanner.stop();

          }

        }

        catch (error) {

          console.log(
            "Scanner stop error:",
            error
          );

        }

      }


      document
        .getElementById("scannerSection")
        .style.display = "none";


      document
        .getElementById("successSection")
        .classList.add("hidden");


      document
        .getElementById("errorSection")
        .classList.remove("hidden");


      document
        .getElementById("errorMessage")
        .innerText =
          message;

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(
      text
    ) {

      const div =
        document.createElement("div");

      div.textContent =
        String(text);

      return div.innerHTML;

    }


    /* =====================================================
       PAGE LOAD
       ===================================================== */

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );


  </script>


</body>

</html>

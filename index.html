<body>

  </div>

  <!-- ================================================= -->

  <!-- HIDDEN IFRAME -->

  <!-- ================================================= -->

  <iframe
    id="logFrame"
    name="logFrame"
    style="display:none;">
  </iframe>

  <script>

    /*
     * =====================================================
     * APPS SCRIPT URL
     * =====================================================
     */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzIxOUSFs8XCDlT2O7oU-FC48UUb61G9dJRN45ZiKOMU_4gO27Pp1kXWlP2R4RF5ASIpg/exec";


    /*
     * =====================================================
     * SCANNER SETTINGS
     * =====================================================
     */

    const STATION = "MAIN";

    const LOG_TYPE = "SCAN";


    /*
     * =====================================================
     * VARIABLES
     * =====================================================
     */

    let scanner = null;

    let scanning = false;

    let logging = false;


    /*
     * =====================================================
     * START SCANNER
     * =====================================================
     */

    async function startScanner() {

      if (scanning) {
        return;
      }

      hideAllSections();

      document
        .getElementById("scannerSection")
        .classList.remove("hidden");

      document
        .getElementById("scannerStatus")
        .textContent =
        "STARTING CAMERA...";

      try {

        scanner =
          new Html5Qrcode("reader");

        scanning = true;


        await scanner.start(

          {
            facingMode: "user"
          },

          {
            fps: 10,

            qrbox: {
              width: 300,
              height: 300
            },

            aspectRatio: 1.0
          },

          handleQRCode,

          function(errorMessage) {

            /*
             * Normal scanning errors are ignored.
             */

          }

        );


        document
          .getElementById("scannerStatus")
          .textContent =
          "READY TO SCAN";

      }

      catch (error) {

        console.error(error);

        scanning = false;

        showError(
          "Unable to access the camera.<br><br>" +
          "Please allow webcam access in your browser."
        );

      }

    }


    /*
     * =====================================================
     * HANDLE QR CODE
     * =====================================================
     */

    async function handleQRCode(decodedText) {

      if (!decodedText) {
        return;
      }

      if (logging) {
        return;
      }

      logging = true;


      console.log(
        "QR DATA:",
        decodedText
      );


      /*
       * Example:
       *
       * 408818180002,SHION VENZY TAKEO J.,June 23, 2013
       *
       * First value = LRN
       */

      const parts =
        decodedText
          .split(",")
          .map(function(value) {
            return value.trim();
          });


      const lrn =
        parts[0];


      /*
       * Validate LRN.
       */

      if (!/^\d{12}$/.test(lrn)) {

        logging = false;

        showError(
          "INVALID QR CODE<br><br>" +
          "The QR code does not contain a valid 12-digit LRN."
        );

        return;
      }


      /*
       * Stop scanning while the log is being recorded.
       */

      await stopScanner();


      /*
       * Send to Apps Script.
       */

      sendScan(
        lrn,
        decodedText
      );

    }


    /*
     * =====================================================
     * SEND SCAN
     * =====================================================
     */

    function sendScan(
      lrn,
      decodedText
    ) {

      const url =
        APPS_SCRIPT_URL +

        "?lrn=" +
        encodeURIComponent(lrn) +

        "&station=" +
        encodeURIComponent(STATION) +

        "&logType=" +
        encodeURIComponent(LOG_TYPE) +

        "&t=" +
        Date.now();


      console.log(
        "Sending scan:",
        url
      );


      document
        .getElementById("logFrame")
        .src = url;


      /*
       * Wait for Apps Script to process
       * the request.
       */

      setTimeout(
        function() {

          showSuccess(
            lrn,
            decodedText
          );

        },
        1200
      );

    }


    /*
     * =====================================================
     * SHOW SUCCESS
     * =====================================================
     */

    function showSuccess(
      lrn,
      decodedText
    ) {

      hideAllSections();


      const parts =
        decodedText
          .split(",")
          .map(function(value) {
            return value.trim();
          });


      let name = "";

      let birthday = "";


      if (parts.length >= 2) {

        name =
          parts[1];

      }


      if (parts.length >= 3) {

        birthday =
          parts
            .slice(2)
            .join(", ");

      }


      document
        .getElementById("successDetails")
        .innerHTML =

        "<div class='learner-name'>" +

        escapeHtml(
          name || "LEARNER"
        ) +

        "</div>" +

        "<strong>LRN:</strong> " +

        escapeHtml(
          lrn
        ) +

        "<br>" +

        (
          birthday

            ? "<strong>Birthday:</strong> " +
              escapeHtml(birthday)

            : ""
        );


      document
        .getElementById("successQR")
        .innerHTML =

        "<strong>QR DATA</strong><br>" +

        escapeHtml(
          decodedText
        );


      document
        .getElementById("successSection")
        .classList
        .remove("hidden");

    }


    /*
     * =====================================================
     * SHOW ERROR
     * =====================================================
     */

    function showError(message) {

      hideAllSections();


      document
        .getElementById("errorMessage")
        .innerHTML =
        message;


      document
        .getElementById("errorSection")
        .classList
        .remove("hidden");

    }


    /*
     * =====================================================
     * RESTART
     * =====================================================
     */

    async function restartScanner() {

      logging = false;


      await stopScanner();


      document
        .getElementById("reader")
        .innerHTML = "";


      startScanner();

    }


    /*
     * =====================================================
     * STOP SCANNER
     * =====================================================
     */

    async function stopScanner() {

      if (
        scanner &&
        scanning
      ) {

        try {

          await scanner.stop();

        }

        catch (error) {

          console.log(
            "Scanner stop:",
            error
          );

        }


        try {

          await scanner.clear();

        }

        catch (error) {

          console.log(
            "Scanner clear:",
            error
          );

        }

      }


      scanning = false;

      scanner = null;

    }


    /*
     * =====================================================
     * HIDE ALL SECTIONS
     * =====================================================
     */

    function hideAllSections() {

      document
        .getElementById("scannerSection")
        .classList
        .add("hidden");


      document
        .getElementById("successSection")
        .classList
        .add("hidden");


      document
        .getElementById("errorSection")
        .classList
        .add("hidden");

    }


    /*
     * =====================================================
     * ESCAPE HTML
     * =====================================================
     */

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /*
     * =====================================================
     * START AUTOMATICALLY
     * =====================================================
     */

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>

  <!-- Hidden iframe used to send the scan to Apps Script -->

  <iframe
    id="logFrame"
    name="logFrame"
    style="display:none;">
  </iframe>

  <script>

    /*
     * =========================================================
     * GOOGLE APPS SCRIPT WEB APP
     * =========================================================
     */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzIxOUSFs8XCDlT2O7oU-FC48UUb61G9dJRN45ZiKOMU_4gO27Pp1kXWlP2R4RF5ASIpg/exec";


    /*
     * =========================================================
     * SETTINGS
     * =========================================================
     */

    const STATION = "MAIN";
    const LOG_TYPE = "SCAN";

    let scanner = null;
    let scanning = false;
    let logging = false;


    /*
     * =========================================================
     * START SCANNER
     * =========================================================
     */

    async function startScanner() {

      if (scanning) {
        return;
      }

      hideAllSections();

      document
        .getElementById("scannerSection")
        .classList.remove("hidden");

      document
        .getElementById("scannerStatus")
        .textContent =
        "Starting camera...";

      try {

        scanner =
          new Html5Qrcode("reader");

        scanning = true;

        await scanner.start(

          {
            facingMode: "user"
          },

          {
            fps: 10,

            qrbox: {
              width: 300,
              height: 300
            },

            aspectRatio: 1.0

          },

          handleQRCode,

          function(errorMessage) {
            // Ignore normal scanning errors.
          }

        );

        document
          .getElementById("scannerStatus")
          .textContent =
          "READY TO SCAN";

      }
      catch (error) {

        console.error(error);

        scanning = false;

        showError(
          "Unable to access the camera.<br><br>" +
          "Please make sure your browser has permission " +
          "to use the webcam."
        );

      }

    }


    /*
     * =========================================================
     * QR CODE DETECTED
     * =========================================================
     */

    async function handleQRCode(decodedText) {

      if (!decodedText) {
        return;
      }

      if (logging) {
        return;
      }

      logging = true;

      console.log("QR DATA:", decodedText);

      /*
       * Example QR:
       *
       * 408818180002,SHION VENZY TAKEO J.,June 23, 2013
       *
       * The first value is the LRN.
       */

      const parts =
        decodedText
          .split(",")
          .map(function(item) {
            return item.trim();
          });

      const lrn = parts[0];

      /*
       * Validate LRN
       */

      if (!/^\d{12}$/.test(lrn)) {

        logging = false;

        showError(
          "Invalid QR code.<br><br>" +
          "The QR code does not contain a valid 12-digit LRN."
        );

        return;
      }


      /*
       * Stop camera before sending the log.
       */

      await stopScanner();


      /*
       * Send scan to Apps Script.
       */

      sendScan(
        lrn,
        decodedText
      );

    }


    /*
     * =========================================================
     * SEND SCAN TO APPS SCRIPT
     * =========================================================
     */

    function sendScan(
      lrn,
      decodedText
    ) {

      const url =
        APPS_SCRIPT_URL +
        "?lrn=" +
        encodeURIComponent(lrn) +
        "&station=" +
        encodeURIComponent(STATION) +
        "&logType=" +
        encodeURIComponent(LOG_TYPE) +
        "&t=" +
        Date.now();


      console.log(
        "Sending scan:",
        url
      );


      /*
       * Load the Apps Script URL inside
       * the hidden iframe.
       */

      document
        .getElementById("logFrame")
        .src = url;


      /*
       * Give Apps Script time to write
       * the record into Google Sheets.
       */

      setTimeout(
        function() {

          showSuccess(
            lrn,
            decodedText
          );

        },
        1200
      );

    }


    /*
     * =========================================================
     * SUCCESS SCREEN
     * =========================================================
     */

    function showSuccess(
      lrn,
      decodedText
    ) {

      hideAllSections();

      const parts =
        decodedText
          .split(",")
          .map(function(item) {
            return item.trim();
